name: ci

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes -r requirements-data.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed package entry points (offline build)
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip wheel --no-index --no-deps --no-build-isolation . --wheel-dir tmp/wheels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskWheel = Get-ChildItem tmp/wheels/stock_data_trading_assistant-*.whl
          if ($taskWheel.Count -ne 1) { throw 'Expected exactly one project wheel' }
          python -m venv tmp/core-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tmp/core-runtime/Scripts/python.exe -m pip install --require-hashes -r requirements-core.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tmp/core-runtime/Scripts/python.exe -m pip install --no-index --no-deps $taskWheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The delivery verifier owns lint, migrations, installed dependency checks,
          # the installed entrypoint probe and the single full test run.
          python tools/v2/verify_delivery.py --output tmp/delivery --installed-python tmp/core-runtime/Scripts/python.exe --wheel $taskWheel.FullName --minimal-runtime --data-lane
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-evidence-${{ github.sha }}
          path: tmp/delivery/
  research:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-test.lock
      - name: Install frozen research and test runtime
        run: |
          python -m pip install --require-hashes -r requirements-research-test.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Mandatory QLib Alpha158 fit and frozen inference
        run: python -m pytest -o addopts= -q tests/test_research_runtime_contract.py tests/test_research_delivery.py::test_prediction_and_contributions_use_frozen_feature_order --junitxml=tmp/research/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-evidence-${{ github.sha }}
          path: tmp/research/
  acceptance:
    if: always()
    needs: [test, research]
    runs-on: ubuntu-latest
    steps:
      - name: Both profiles must pass on this commit
        env:
          DATA_RESULT: ${{ needs.test.result }}
          RESEARCH_RESULT: ${{ needs.research.result }}
        run: test "$DATA_RESULT" = success && test "$RESEARCH_RESULT" = success
